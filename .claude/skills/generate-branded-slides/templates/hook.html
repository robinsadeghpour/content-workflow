<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn — Slide 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg: #fafaf8;
      --accent-600: #4f46e5;
      --accent-500: #6366f1;
      --text-950: #0f172a;
      --frame: #0a0a0a;
      --slide-w: 1080px;
      --slide-h: 1350px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px 64px;
    }

    .slide-frame {
      width: var(--slide-w);
      height: var(--slide-h);
      flex-shrink: 0;
    }

    .slide {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      background-image: url("../assets/example-background.png");
      background-size: cover;
      background-position: center;
      color: var(--text-950);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-rule {
      position: relative;
      padding: 54px 56px 0;
      flex-shrink: 0;
      z-index: 2;
      height: 112px;
    }

    .top-rule__logotype {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      position: absolute;
      left: 56px;
      bottom: 22px;
      z-index: 2;
    }

    .top-rule__logo-underline {
      position: absolute;
      left: 56px;
      width: 136px;
      bottom: 22px;
      height: 3px;
      background: var(--accent-600);
    }

    .top-rule__line {
      position: absolute;
      left: 136px;
      right: 56px;
      bottom: 22px;
      height: 3px;
      background: var(--accent-600);
    }

    .top-rule__line-bottom {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 14px;
      height: 3px;
      background: var(--accent-600);
    }

    .slide-content {
      position: relative;
      z-index: 2;
      padding: 56px 56px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .slide-kicker {
      font-family: "Inter", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: 110px;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--accent-600);
      display: inline-block;
      margin-bottom: 32px;
      padding-bottom: 0px;
      border-bottom: 4px solid var(--accent-600);
    }

    .slide-headline {
      font-family: "Inter", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: 96px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text-950);
      max-width: 13ch;
    }

    .slide-figure {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .slide-figure img {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      object-position: bottom right;
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div class="slide-frame" aria-hidden="true">
    <div class="slide" role="img" aria-label="LinkedIn carousel slide 1">
      <div class="top-rule">
        <img
          class="top-rule__logotype"
          src="../assets/example-logotype.svg"
          alt=""
        />
        <span class="top-rule__line"></span>
        <span class="top-rule__line-bottom"></span>
      </div>

      <div class="slide-content">
        <span class="slide-kicker">3 Features</span>
        <h1 class="slide-headline">
          Claude Code<br />
          dropped this<br />
          week
        </h1>
      </div>

    </div>
  </div>
</body>
</html>
