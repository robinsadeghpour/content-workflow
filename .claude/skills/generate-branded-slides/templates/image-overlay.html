<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn — Content Slide (Image Overlay)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --accent-600: #4f46e5;
      --accent-500: #6366f1;
      --text-950: #0f172a;
      --frame: #0a0a0a;
      --slide-w: 1080px;
      --slide-h: 1350px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px 64px;
    }

    .slide-frame {
      width: var(--slide-w);
      height: var(--slide-h);
      flex-shrink: 0;
    }

    .slide {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      background-image: url("../assets/example-background.png");
      background-size: cover;
      background-position: center;
      color: var(--text-950);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-rule {
      position: relative;
      padding: 54px 56px 0;
      flex-shrink: 0;
      z-index: 2;
      height: 112px;
    }

    .top-rule__logotype {
      height: 52px; width: auto; object-fit: contain; display: block;
      position: absolute; left: 56px; bottom: 22px; z-index: 2;
    }
    .top-rule__logo-underline {
      position: absolute; left: 56px; width: 20px; bottom: 22px;
      height: 3px; background: var(--accent-600);
    }
    .top-rule__line {
      position: absolute; left: 136px; right: 56px; bottom: 22px;
      height: 3px; background: var(--accent-600);
    }
    .top-rule__line-bottom {
      position: absolute; left: 56px; right: 56px; bottom: 14px;
      height: 3px; background: var(--accent-600);
    }

    .slide-content {
      position: relative;
      z-index: 2;
      padding: 56px 56px 56px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 1;
    }

    .slide-kicker {
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 500;
      font-size: 64px;
      line-height: 1.1;
      letter-spacing: 0.02em;
      color: var(--accent-600);
      display: inline-block;
      margin-bottom: 20px;
      padding-bottom: 2px;
      border-bottom: 3px solid var(--accent-600);
      text-transform: uppercase;
    }

    .slide-headline {
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 500;
      font-size: 56px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text-950);
      max-width: 18ch;
      margin-bottom: 32px;
    }

    .slide-image-frame {
      align-self: stretch;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.10);
      padding: 24px;
      min-height: 0;
    }

    .slide-image-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .slide-image-caption {
      font-family: "Inter", system-ui, sans-serif;
      font-style: italic;
      font-weight: 400;
      font-size: 28px;
      line-height: 1.35;
      color: rgba(15, 23, 42, 0.72);
      margin-top: 24px;
      align-self: stretch;
    }
  </style>
</head>
<body>
  <div class="slide-frame" aria-hidden="true">
    <div class="slide" role="img" aria-label="LinkedIn carousel slide — image overlay">
      <div class="top-rule">
        <img class="top-rule__logotype" src="../assets/example-logotype.svg" alt="" />
        <span class="top-rule__logo-underline"></span>
        <span class="top-rule__line"></span>
        <span class="top-rule__line-bottom"></span>
      </div>

      <div class="slide-content">
        <span class="slide-kicker">Result</span>
        <h1 class="slide-headline">Same outbound. No SaaS tax.</h1>
        <div class="slide-image-frame">
          <img src="../assets/example-screenshot.png" alt="" />
        </div>
        <p class="slide-image-caption">running on a single API key</p>
      </div>
    </div>
  </div>
</body>
</html>
