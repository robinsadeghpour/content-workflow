<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn — Content Slide (Bullets)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg: #fafaf8;
      --accent-600: #4f46e5;
      --accent-500: #6366f1;
      --text-950: #0f172a;
      --frame: #0a0a0a;
      --slide-w: 1080px;
      --slide-h: 1350px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px 64px;
    }

    .slide-frame {
      width: var(--slide-w);
      height: var(--slide-h);
      flex-shrink: 0;
    }

    .slide {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      background-image: url("../assets/example-background.png");
      background-size: cover;
      background-position: center;
      color: var(--text-950);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-rule {
      position: relative;
      padding: 54px 56px 0;
      flex-shrink: 0;
      z-index: 2;
      height: 112px;
    }

    .top-rule__logotype {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      position: absolute;
      left: 56px;
      bottom: 22px;
      z-index: 2;
    }

    .top-rule__logo-underline {
      position: absolute;
      left: 56px;
      width: 136px;
      bottom: 22px;
      height: 3px;
      background: var(--accent-600);
    }

    .top-rule__line {
      position: absolute;
      left: 122px;
      right: 56px;
      bottom: 22px;
      height: 3px;
      background: var(--accent-600);
    }

    .top-rule__line-bottom {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 14px;
      height: 3px;
      background: var(--accent-600);
    }

    .slide-content {
      position: relative;
      z-index: 2;
      padding: 72px 56px 56px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 1;
    }

    .slide-kicker {
      font-family: "Inter", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: 64px;
      line-height: 1.1;
      letter-spacing: 0.02em;
      color: var(--accent-600);
      display: inline-block;
      margin-bottom: 28px;
      padding-bottom: 2px;
      border-bottom: 3px solid var(--accent-600);
      text-transform: uppercase;
    }

    .slide-headline {
      font-family: "Inter", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: 72px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text-950);
      max-width: 14ch;
      margin-bottom: 48px;
    }

    .slide-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 0;
      padding: 0;
    }

    .slide-bullets {
      align-self: stretch;
    }

    .slide-bullets li {
      font-family: "Inter", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-size: 32px;
      line-height: 1.3;
      color: var(--text-950);
      position: relative;
      padding-left: 32px;
    }

    .slide-bullets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 16px;
      width: 12px;
      height: 12px;
      background: var(--accent-600);
    }
  </style>
</head>
<body>
  <div class="slide-frame" aria-hidden="true">
    <div class="slide" role="img" aria-label="LinkedIn carousel content slide — bullets">
      <div class="top-rule">
        <img
          class="top-rule__logotype"
          src="../assets/example-logotype.svg"
          alt=""
        />
        <span class="top-rule__logo-underline"></span>
        <span class="top-rule__line"></span>
        <span class="top-rule__line-bottom"></span>
      </div>

      <div class="slide-content">
        <span class="slide-kicker">Feature 02</span>
        <h1 class="slide-headline">
          What you get
        </h1>
        <ul class="slide-bullets">
          <li>Parallel execution across named subagents</li>
          <li>Isolated context windows per agent</li>
          <li>Delegate tasks via the Task tool</li>
          <li>Reuse across projects and sessions</li>
        </ul>
      </div>

    </div>
  </div>
</body>
</html>
