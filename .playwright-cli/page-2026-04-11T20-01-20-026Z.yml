        - paragraph [ref=e332]: "5 Claude Code skills I use on every project. All free. All installed in under a minute. Here's the stack: 1. Frontend Design Stops Claude generating generic AI-looking interfaces. Real brand tokens, not a ChatGPT wrapper. Install via /plugin, search \"frontend design\". 2. Simplify 3 agents review your code and fix issues automatically. I run /simplify after every coding session. 3. Skill Creator Tell it what you want to automate. It builds the Claude Code skill — with eval built in so you can measure whether your prompt changes actually work. 4. Web App Testing Claude tests your app, not just writes it. Playwright-based, runs against your live dev server. 5. MCP Builder Connects Claude to any API or external tool. Once you understand MCP, you stop copy-pasting between tools. The people building fastest have better defaults. That's the whole thing. What's in your stack?"
