<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Carousel — 7 new open source AI tools you need right now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Brand Tokens */
    :root {
      --color-primary:  #0A0A0A;
      --color-accent:   #C8A96E;
      --color-bg:       #FAFAF8;
      --color-text:     #1A1A1A;
      --color-muted:    #6B6B6B;
      --font-serif:     'Cormorant Garamond', Georgia, serif;
      --font-mono:      'JetBrains Mono', 'Courier New', monospace;
      --font-sans:      'Outfit', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e8e8;
      font-family: var(--font-sans);
    }

    .slides-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px;
    }

    .slide {
      width: 1080px;
      height: 1080px;
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
    }

    .slide--cover {
      background: var(--color-primary);
      color: white;
    }

    .slide--cta {
      background: var(--color-accent);
      color: var(--color-primary);
    }

    .slide__cover-content,
    .slide__content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }

    .slide__label {
      font-family: var(--font-mono);
      font-size: 18px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .slide__title {
      font-family: var(--font-serif);
      font-size: 72px;
      font-weight: 500;
      line-height: 1.1;
      color: inherit;
    }

    .slide--cover .slide__title {
      color: white;
    }

    .slide__subtitle,
    .slide__body {
      font-family: var(--font-sans);
      font-size: 28px;
      font-weight: 300;
      line-height: 1.6;
      opacity: 0.85;
    }

    .slide__slide-number {
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.1em;
      opacity: 0.4;
    }

    .slide__cta-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slide__author {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 600;
    }

    .slide__platform {
      font-family: var(--font-mono);
      font-size: 16px;
      opacity: 0.6;
    }

    
  </style>
</head>
<body>
  <div class="slides-container">
    
  <div class="slide slide--cover">
    <div class="slide__cover-content">
      <div class="slide__label">Robin Sadeghpour</div>
      <h1 class="slide__title"></h1>
      <p class="slide__subtitle"></p>
      <div class="slide__slide-number">01 / 09</div>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">02 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">03 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">04 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">05 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">06 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">07 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide">
    <div class="slide__content">
      <div class="slide__slide-number">08 / 09</div>
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
    </div>
  </div>

  <div class="slide slide--cta">
    <div class="slide__content">
      <h2 class="slide__title"></h2>
      <p class="slide__body"></p>
      <div class="slide__cta-footer">
        <span class="slide__author">Robin Sadeghpour</span>
        <span class="slide__platform">linkedin.com/in/robinsadeghpour</span>
      </div>
    </div>
  </div>
  </div>
</body>
</html>
