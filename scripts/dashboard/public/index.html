<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Lucide icon sprite (inline SVG) -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="icon-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
    <symbol id="icon-layout-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="icon-bar-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></symbol>
    <symbol id="icon-rss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
    <symbol id="icon-more-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
  </svg>

  <div class="app">
    <aside class="rail" aria-label="Primary navigation">
      <div class="rail__logo" aria-hidden="true">
        <svg class="icon"><use href="#icon-zap"/></svg>
        <span class="rail__logo-text">Workflow</span>
      </div>
      <nav class="rail__nav">
        <button class="rail__item is-active" data-view="feed" aria-label="Feed">
          <svg class="icon"><use href="#icon-rss"/></svg>
          <span class="rail__label">Feed</span>
        </button>
        <button class="rail__item" data-view="backlog" aria-label="Backlog">
          <svg class="icon"><use href="#icon-list"/></svg>
          <span class="rail__label">Backlog</span>
        </button>
        <button class="rail__item" data-view="pipeline" aria-label="Pipeline">
          <svg class="icon"><use href="#icon-layout-grid"/></svg>
          <span class="rail__label">Pipeline</span>
        </button>
        <button class="rail__item" data-view="performance" aria-label="Performance">
          <svg class="icon"><use href="#icon-bar-chart"/></svg>
          <span class="rail__label">Performance</span>
        </button>
        <button class="rail__item" data-view="workflows" aria-label="Workflows">
          <svg class="icon"><use href="#icon-activity"/></svg>
          <span class="rail__label">Workflows</span>
        </button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__chips" id="topbar-chips">
          <div class="chip"><span class="chip__label">New</span><span class="chip__value" id="chip-new">--</span></div>
          <div class="chip"><span class="chip__label">Kept</span><span class="chip__value" id="chip-kept">--</span></div>
          <div class="chip"><span class="chip__label">Starred</span><span class="chip__value" id="chip-starred">--</span></div>
        </div>
        <div class="topbar__search">
          <svg class="icon"><use href="#icon-search"/></svg>
          <input type="search" id="global-search" placeholder="Search ideas..." aria-label="Search" />
        </div>
        <button class="btn btn--primary" id="btn-run-pulse">
          <svg class="icon"><use href="#icon-zap"/></svg>
          Run Pulse
        </button>
      </header>

      <div class="views">
        <!-- FEED -->
        <section class="view" id="view-feed" tabindex="-1">
          <div class="feed-wrap">
            <div class="feed-stack" id="feed-stack" aria-live="polite"></div>
            <div class="feed-empty" id="feed-empty" hidden>
              <h2>Inbox zero</h2>
              <p id="feed-empty-stats">No new ideas to review.</p>
              <button class="btn btn--primary" id="feed-empty-pulse">
                <svg class="icon"><use href="#icon-zap"/></svg>
                Run Pulse
              </button>
            </div>
          </div>
        </section>

        <!-- BACKLOG -->
        <section class="view" id="view-backlog" hidden>
          <div class="backlog-toolbar">
            <div class="filter-chips" id="backlog-filters">
              <button class="filter-chip is-active" data-filter="all">All</button>
              <button class="filter-chip" data-filter="new">New</button>
              <button class="filter-chip" data-filter="kept">Kept</button>
              <button class="filter-chip" data-filter="starred">Starred</button>
              <button class="filter-chip" data-filter="skipped">Skipped</button>
            </div>
            <label class="score-slider">
              <span>Min score</span>
              <input type="range" id="backlog-score" min="0" max="1" step="0.05" value="0" />
              <span class="score-slider__value" id="backlog-score-val">0.00</span>
            </label>
            <input type="search" class="backlog-search" id="backlog-search" placeholder="Search title or summary..." />
          </div>
          <div class="bulk-bar" id="bulk-bar" hidden>
            <span id="bulk-count">0 selected</span>
            <button class="btn btn--ghost" data-bulk="kept">Keep</button>
            <button class="btn btn--ghost" data-bulk="skipped">Skip</button>
            <button class="btn btn--ghost" data-bulk="starred">Star</button>
          </div>
          <div class="table-wrap" id="backlog-scroll">
            <table class="table" id="backlog-table">
              <thead>
                <tr>
                  <th style="width:32px"><input type="checkbox" id="backlog-select-all" aria-label="Select all" /></th>
                  <th style="width:90px">ID</th>
                  <th>Title</th>
                  <th>Source</th>
                  <th style="width:140px">Score</th>
                  <th>Status</th>
                  <th>Scraped</th>
                </tr>
              </thead>
              <tbody id="backlog-tbody"></tbody>
            </table>
          </div>
        </section>

        <!-- PIPELINE -->
        <section class="view" id="view-pipeline" hidden>
          <div class="kanban" id="kanban"></div>
        </section>

        <!-- PERFORMANCE -->
        <section class="view" id="view-performance" hidden>
          <div class="stat-grid" id="perf-stats"></div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Platform</th>
                  <th>Preview</th>
                  <th>Views</th>
                  <th>Likes</th>
                  <th>Comments</th>
                  <th>Shares</th>
                  <th>Score</th>
                  <th>Checked</th>
                </tr>
              </thead>
              <tbody id="perf-tbody"></tbody>
            </table>
          </div>
        </section>

        <!-- WORKFLOWS -->
        <section class="view" id="view-workflows" hidden>
          <div class="workflow-top">
            <div class="cron-status" id="cron-status">
              <span class="status-dot"></span>
              <span id="cron-label">Checking daemon...</span>
            </div>
            <div class="workflow-actions">
              <button class="btn btn--primary" data-trigger="pulse">
                <svg class="icon"><use href="#icon-zap"/></svg>
                Run Pulse
              </button>
              <button class="btn btn--ghost" data-trigger="perf-check">
                <svg class="icon"><use href="#icon-activity"/></svg>
                Run Perf-Check
              </button>
            </div>
          </div>
          <h3 class="section-title">Jobs</h3>
          <div class="jobs-list" id="jobs-list"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Idea details">
    <header class="drawer__head">
      <h2 id="drawer-title">Idea</h2>
      <button class="btn btn--icon" id="drawer-close" aria-label="Close">
        <svg class="icon"><use href="#icon-x"/></svg>
      </button>
    </header>
    <div class="drawer__body" id="drawer-body"></div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast" hidden aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
